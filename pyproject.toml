[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aemo-gridcast"
version = "2.0.0"
description = "Regional AEMO forecasting, backtests, drift and auditable forecast vintages"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "tzdata>=2024.1", "scipy>=1.15,<2", "lightgbm==4.6.0", "statsmodels==0.14.6", "scikit-learn>=1.6,<2"]

[project.scripts]
gridcast = "gridcast.cli:main"

[tool.setuptools.packages.find]
include = ["gridcast*"]

[tool.setuptools.package-data]
gridcast = ["dashboard.html"]
