name: Publish forecast archive
on:
  push:
    paths:
      - gridcast/archive.py
      - .github/workflows/archive.yml
  workflow_run:
    workflows: ["Gridcast hourly inference"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridcast-r2-single-writer
  cancel-in-progress: false
jobs:
  archive:
    if: vars.GRIDCAST_ENABLED == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-cloud.txt
      - run: python -m pip install -r requirements-cloud.txt
      - run: python -m gridcast.archive
