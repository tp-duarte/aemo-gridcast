name: Gridcast hourly inference
on:
  push:
    paths:
      - .github/workflows/hourly.yml
  schedule:
    # Second attempt recovers missed triggers. The ledger is idempotent per UTC hour.
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gridcast-r2-single-writer
  cancel-in-progress: false
jobs:
  forecast:
    if: vars.GRIDCAST_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-cloud.txt
      - run: python -m pip install -r requirements-cloud.txt
      - name: Ingest, load saved models, forecast, evaluate and publish read snapshot
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python -m gridcast.hourly hourly --work .hourly-work; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Forecast attempt $attempt failed; retrying after 60 seconds."
              sleep 60
            fi
          done
          echo "::error::Forecast failed after three attempts; inspect missing observations or source availability."
          exit 1
